name: Headless Smoke Test

"on":
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  smoke-windows:
    name: Headless smoke test (Windows)
    runs-on: windows-latest
    env:
      PYTHON_VERSION: '3.11'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip (Windows)
        uses: actions/cache@v4
        with:
          path: |
            %USERPROFILE%\\AppData\\Local\\pip\\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('HjemmeladingApp/requirements-dev.txt') }}-${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 matplotlib pillow pytest
      - name: Run headless smoke test
        run: |
          python tools/headless_smoke_test.py

      - name: Export component catalogs
        run: |
          python .github/tools/export_component_catalogs.py

      - name: Run core regression suite
        run: |
          python -m pytest -q -m core

      - name: Run catalog engine regression check
        run: |
          python -m src.tools.catalog_engine_regression_check --report-json .github/data/exports/catalog_engine_regression_check.audit.json --report-md .github/data/exports/catalog_engine_regression_check.audit.md

      - name: Upload catalog audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-catalog-audits
          path: |
            .github/data/exports/bullets_catalog_master_clean.audit.json
            .github/data/exports/bullets_catalog_master_clean.audit.md
            .github/data/exports/powder_catalog_master_clean.audit.json
            .github/data/exports/powder_catalog_master_clean.audit.md
            .github/data/exports/catalog_engine_regression_check.audit.json
            .github/data/exports/catalog_engine_regression_check.audit.md
            .github/data/exports/components_catalog_manifest.json
            .github/data/exports/primers_catalog_master.csv
            .github/data/exports/primers_catalog_tidy.csv
            .github/data/exports/cases_catalog_master.csv
            .github/data/exports/cases_catalog_tidy.csv

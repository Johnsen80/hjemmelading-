name: Collect Artifacts

on:
  push:
    branches: [ main, lint/auto-fix ]
  pull_request:
    branches: [ main ]

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f HjemmeladingApp/requirements-dev.txt ]; then pip install -r HjemmeladingApp/requirements-dev.txt || true; fi

      - name: Run tests
        working-directory: HjemmeladingApp
        run: |
          python -m pytest -q || true

      - name: Collect artifacts
        working-directory: HjemmeladingApp
        run: |
          python scripts/collect_artifacts.py || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hjemmelading-artifacts
          path: HjemmeladingApp/artifacts

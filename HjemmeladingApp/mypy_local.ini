[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
# Exclude helper scripts, certain UI/runtime files, and virtualenvs from package analysis (regex)
exclude = (?:^HjemmeladingApp/scripts/|^HjemmeladingApp/tools/|^HjemmeladingApp/tests/|^HjemmeladingApp/ui/customizer.py|^HjemmeladingApp/ui/profile_editor.py|^HjemmeladingApp/utils/backgrounds.py|^HjemmeladingApp/main.py|\.venv/|^__pycache__/)
show_error_codes = True

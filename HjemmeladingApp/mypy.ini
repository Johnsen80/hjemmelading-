[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
show_error_codes = True
# Exclude helper scripts, tools, tests, build artifacts, and virtualenvs
exclude = (?:^|/)(scripts|tools|tests|dist|dist_debug|dist_release|build|build_debug|build_release|node_modules|\.venv|__pycache__)/

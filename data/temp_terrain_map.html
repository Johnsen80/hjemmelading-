
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Terrengkart</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Opprett kart
        var map = L.map('map').setView([59.9139, 10.7522], 10);
        
        // Legg til OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        // Legg til OpenTopoMap
        var topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: 'OpenTopoMap',
            maxZoom: 17
        });
        
        // Layer control
        var baseMaps = {
            "Standard": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
            "Topografisk": topoLayer
        };
        
        L.control.layers(baseMaps).addTo(map);
        
        // Info marker
        L.marker([59.9139, 10.7522])
            .addTo(map)
            .bindPopup('<b>Oslo sentrum</b><br>Bruk manuelle koordinater nedenfor for analyse')
            .openPopup();
    </script>
</body>
</html>

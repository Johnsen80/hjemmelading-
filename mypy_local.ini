[mypy]
# Allow missing imports for third-party and project-local dynamic modules
ignore_missing_imports = True
follow_imports = silent
# Exclude helper scripts and tools from strict checking (these are developer tools)
# Exclude helper scripts and tools from strict checking (these are developer tools)
exclude = /scripts/|/tools/
# Keep checks permissive for now; tighten later
python_version = 3.11

# Ignore entire problematic helper modules and developer tools
[mypy-HjemmeladingApp.scripts.*]
ignore_errors = True

[mypy-HjemmeladingApp.tools.*]
ignore_errors = True

# Some UI and utils modules use runtime-only imports and fallback shims
[mypy-HjemmeladingApp.utils.backgrounds]
ignore_errors = True

[mypy-HjemmeladingApp.ui.customizer]
ignore_errors = True

[mypy-HjemmeladingApp.ui.profile_editor]
ignore_errors = True

[mypy-HjemmeladingApp.main]
ignore_errors = True

[mypy-HjemmeladingApp.utils.fonts]
ignore_errors = True

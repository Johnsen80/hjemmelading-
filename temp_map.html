        <script>
        var shooterMarker = null;
        var targetMarker = null;
        var line = null;
        
        function onMapClick(e) {
            if (!shooterMarker) {
                // Første klikk: Sett skytter
                shooterMarker = L.marker(e.latlng, {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                }).addTo(map_);
                shooterMarker.bindPopup("<b>Skyteposisjon</b><br>Lat: " + e.latlng.lat.toFixed(5) + "<br>Lon: " + e.latlng.lng.toFixed(5)).openPopup();
            } else if (!targetMarker) {
                // Andre klikk: Sett mål
                targetMarker = L.marker(e.latlng, {
                    icon: L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    })
                }).addTo(map_);
                targetMarker.bindPopup("<b>Mål</b><br>Lat: " + e.latlng.lat.toFixed(5) + "<br>Lon: " + e.latlng.lng.toFixed(5)).openPopup();
                
                // Tegn linje
                line = L.polyline([shooterMarker.getLatLng(), targetMarker.getLatLng()], {
                    color: 'red',
                    weight: 3,
                    opacity: 0.7,
                    dashArray: '10, 5'
                }).addTo(map_);
                
                // Beregn distanse
                var dist = shooterMarker.getLatLng().distanceTo(targetMarker.getLatLng());
                line.bindPopup("<b>Distanse:</b> " + dist.toFixed(1) + " m");
            }
        }
        
        map_.on('click', onMapClick);
        
        // Reset funksjon
        function resetMarkers() {
            if (shooterMarker) map_.removeLayer(shooterMarker);
            if (targetMarker) map_.removeLayer(targetMarker);
            if (line) map_.removeLayer(line);
            shooterMarker = null;
            targetMarker = null;
            line = null;
        }
        </script>
